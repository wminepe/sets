<!DOCTYPE html>
<html lang="ru" translate="no" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>
(function(){
  try{
    var t = localStorage.getItem('wmine-theme') || 'dark';
    if(t !== 'dark' && t !== 'light') t = 'dark';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>

<title>WMine | Набор в команду</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap">

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ================= ROOT (совпадает с основным сайтом) ================= */
:root{
  --bg:#12090a;
  --surface:#231410;
  --surface-2:#2a1a12;
  --border:rgba(255,140,66,.25);
  --border-soft:rgba(255,140,66,.5);
  --text:#fff3e9;
  --text-soft:#d6b89c;
  --text-muted:#8a7060;
  --orange:#ff8c42;
  --orange-light:#ffb380;
  --amber:#ffc857;
  --red:#ff4d3d;
  --pumpkin:#ff6b1a;
  --blood:#8b1a1a;
  --purple:#a259b8;
  --green:#5aba5a;
  --blue:#6db8ff;
  --shadow-card:0 20px 50px rgba(0,0,0,.5),0 0 40px rgba(255,140,66,.2);
  --radius:24px;
  --radius-lg:32px;
  --t-fast:.2s ease;
  --t-base:.3s cubic-bezier(.23,1,.32,1);
  --hw-web:rgba(255,245,235,.13);
}

[data-theme="light"]{
  --bg:#faf3ec;
  --surface:#ffffff;
  --surface-2:#fff5eb;
  --border:rgba(255,107,26,.22);
  --border-soft:rgba(255,107,26,.5);
  --text:#1a0e08;
  --text-soft:#5c3d2e;
  --text-muted:#8a7060;
  --orange:#e86f1f;
  --orange-light:#ff8c42;
  --amber:#e0a800;
  --shadow-card:0 20px 50px rgba(139,80,40,.15),0 0 40px rgba(255,140,66,.15);
  --hw-web:rgba(60,30,20,.12);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  font-family:'Manrope',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;overflow-x:hidden;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  transition:background-color .3s ease,color .3s ease;
  display:flex;flex-direction:column;align-items:center;
  padding:20px;
  background-image:
    radial-gradient(circle at 15% 15%, rgba(255,140,66,.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(139,26,26,.12) 0%, transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(106,44,143,.08) 0%, transparent 50%);
  background-attachment:fixed;
}
[data-theme="light"] body{
  background-image:
    radial-gradient(circle at 15% 15%, rgba(255,140,66,.15) 0%, transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(139,26,26,.06) 0%, transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(106,44,143,.05) 0%, transparent 50%);
}

::selection{background:var(--orange);color:var(--bg)}

/* ================= HALLOWEEN DECOR ================= */
.hw-web{
  position:fixed;z-index:2;pointer-events:none;
  color:var(--hw-web);
  opacity:0;
  filter:drop-shadow(0 0 4px rgba(255,245,235,.04));
  will-change:opacity,transform;
}
.hw-web-tl{
  top:0;left:0;width:190px;height:190px;
  transform-origin:top left;
  animation:webInTL 1.6s cubic-bezier(.23,1,.32,1) .4s forwards;
}
.hw-web-tr{
  top:0;right:0;width:190px;height:190px;
  transform-origin:top right;
  transform:scaleX(-1);
  animation:webInTR 1.6s cubic-bezier(.23,1,.32,1) .55s forwards;
}
@keyframes webInTL{
  0%{opacity:0;transform:scale(.4) rotate(-8deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
@keyframes webInTR{
  0%{opacity:0;transform:scaleX(-1) scale(.4) rotate(8deg)}
  100%{opacity:1;transform:scaleX(-1) scale(1) rotate(0)}
}
.hw-web svg{width:100%;height:100%;display:block}

.hw-vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.3) 100%),
    radial-gradient(circle at 50% 0%, rgba(106,44,143,.05), transparent 50%),
    radial-gradient(circle at 50% 100%, rgba(255,117,24,.04), transparent 50%);
  mix-blend-mode:multiply;
  opacity:.7;
}
[data-theme="light"] .hw-vignette{
  background:
    radial-gradient(ellipse at center, transparent 55%, rgba(139,80,40,.12) 100%),
    radial-gradient(circle at 50% 0%, rgba(106,44,143,.04), transparent 50%);
  opacity:.5;
}

/* ================= WRAPPER ================= */
.wrapper{
  position:relative;
  z-index:3;
  width:100%;
  max-width:1200px;
  margin:0 auto;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:2rem 2.5rem 2.5rem;
  box-shadow:var(--shadow-card);
  display:flex;
  flex-direction:column;
  transition:background-color .3s ease,border-color .3s ease;
}

/* ================= HEADER ================= */
header{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:1.5rem;
  margin-bottom:2.5rem;
  position:relative;
  z-index:2;
}

.brand{display:flex;align-items:center;gap:.8rem;font-family:'Unbounded',sans-serif;
  font-weight:800;font-size:1.2rem;color:var(--text);text-decoration:none;margin-bottom:.4rem}
.brand-icon{
  width:44px;height:44px;border-radius:50%;
  flex-shrink:0;padding:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,140,66,.45);
  background:linear-gradient(135deg,var(--pumpkin),var(--blood));
  box-shadow:0 0 20px rgba(255,107,26,.4);
  animation:brandGlow 3s ease-in-out infinite;
}
@keyframes brandGlow{
  0%,100%{box-shadow:0 0 20px rgba(255,107,26,.4)}
  50%{box-shadow:0 0 28px rgba(255,117,24,.7)}
}
.brand-avatar{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.brand-year{color:var(--orange);font-size:.75rem;padding:.2rem .7rem;
  background:rgba(255,140,66,.15);border:1px solid rgba(255,140,66,.3);
  border-radius:50px;margin-left:.3rem}

.page-subtitle{
  font-family:'Unbounded',sans-serif;
  font-size:clamp(1.5rem,3vw,2rem);
  font-weight:900;
  letter-spacing:.02em;
  background:linear-gradient(135deg,#fff5eb 0%,#ff6b1a 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1.15;
}
[data-theme="light"] .page-subtitle{
  background:linear-gradient(135deg,#2a1508 0%,#ff6b1a 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.page-subtitle .highlight{
  background:linear-gradient(135deg,var(--orange-light),var(--pumpkin));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}

/* ================= CONTROLS ================= */
.controls{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;position:relative;z-index:2}

button{
  background:rgba(255,140,66,.1);
  border:1px solid var(--border);
  color:var(--text);
  font-family:'Unbounded',sans-serif;
  font-weight:700;
  padding:.6rem 1.1rem;
  border-radius:50px;
  cursor:pointer;
  transition:var(--t-fast);
  display:inline-flex;align-items:center;gap:.4rem;
  font-size:.78rem;
  letter-spacing:.04em;
}
button:hover{
  background:var(--orange);
  color:#1a1005;
  border-color:var(--orange);
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(255,140,66,.4);
}
button:active{
  transform:translateY(0) scale(.97);
  box-shadow:none;
}

/* ================= CONTENT ================= */
.content{
  position:relative;
  z-index:2;
  flex:1;
  display:flex;
  flex-direction:column;
}

.main-title{
  font-family:'Unbounded',sans-serif;
  text-align:center;
  font-size:clamp(1.4rem,3vw,2rem);
  font-weight:900;
  padding-bottom:1rem;
  margin-bottom:1.2rem;
  border-bottom:2px solid var(--border);
  position:relative;
  letter-spacing:.01em;
  color:var(--text);
}
.main-title::after{
  content:'';
  position:absolute;
  bottom:-2px;left:50%;
  transform:translateX(-50%);
  width:80px;height:3px;
  background:linear-gradient(90deg,var(--orange),var(--pumpkin));
  border-radius:3px;
}
.main-title .highlight{
  background:linear-gradient(135deg,var(--orange-light),var(--pumpkin));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

.sub-header{
  text-align:center;
  font-size:.9rem;
  color:var(--text-muted);
  margin-bottom:1.5rem;
  line-height:1.6;
}
.sub-header a{
  color:var(--orange);
  font-weight:700;
  text-decoration:none;
  transition:color var(--t-fast);
}
.sub-header a:hover{color:var(--amber)}

/* ================= CARDS ================= */
.cards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:1.2rem;
  margin-bottom:1.5rem;
}

.direction-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:2rem 1.5rem;
  text-align:center;
  cursor:pointer;
  transition:transform var(--t-base),border-color var(--t-base),box-shadow var(--t-base);
  position:relative;
  display:flex;flex-direction:column;align-items:center;gap:.8rem;
  overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.direction-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--orange),transparent);
  opacity:0;transition:opacity var(--t-fast);
}
.direction-card:hover:not(.disabled){
  transform:translateY(-6px);
  border-color:var(--border-soft);
  box-shadow:var(--shadow-card);
}
.direction-card:hover:not(.disabled)::before{opacity:1}
.direction-card:active:not(.disabled){transform:translateY(-2px) scale(.99)}

.card-icon{
  font-size:2.6rem;
  line-height:1;
  transition:transform var(--t-base);
  display:flex;align-items:center;justify-content:center;
  width:80px;height:80px;
  border-radius:22px;
  border:1px solid var(--border);
}
.card-icon.orange{
  background:linear-gradient(135deg,rgba(255,140,66,.2),rgba(255,140,66,.06));
  border-color:rgba(255,140,66,.35);
}
.card-icon.gray{
  background:rgba(138,112,96,.1);
  border-color:rgba(138,112,96,.25);
  filter:grayscale(1);
}
.direction-card:hover:not(.disabled) .card-icon{transform:scale(1.08) rotate(-4deg)}

.card-title{
  font-family:'Unbounded',sans-serif;
  font-weight:800;
  font-size:1.05rem;
  color:var(--text);
  letter-spacing:.01em;
}
.card-desc{
  font-size:.85rem;
  color:var(--text-soft);
  line-height:1.5;
  flex:1;
}
.card-badge{
  display:inline-block;
  padding:.25rem .85rem;
  border-radius:50px;
  font-size:.7rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  background:rgba(90,186,90,.15);
  color:#5aba5a;
  border:1px solid rgba(90,186,90,.35);
}
.card-badge.closed{
  background:rgba(255,77,77,.12);
  color:#ff6b6b;
  border-color:rgba(255,77,77,.3);
}

.direction-card.disabled{
  opacity:.55;
  cursor:not-allowed;
  background:rgba(255,140,66,.02);
}
.direction-card.disabled:hover{
  transform:none;
  border-color:var(--border);
  box-shadow:none;
}

.closed-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.55);
  border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Unbounded',sans-serif;
  font-weight:800;
  font-size:.8rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#fff;
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  z-index:5;
}

/* ================= FORM ================= */
.form-container{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  min-height:520px;
  position:relative;
}
.form-container iframe{
  width:100%;
  height:720px;
  border:none;
  background:transparent;
  display:block;
}

/* ================= TOAST ================= */
.toast{
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translate(-50%,150%);
  background:linear-gradient(135deg,var(--pumpkin),var(--blood));
  color:#fff;
  padding:.9rem 1.6rem;
  border-radius:50px;
  font-weight:700;
  font-size:.85rem;
  z-index:9998;
  pointer-events:none;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 12px 40px rgba(255,107,26,.5);
  font-family:'Manrope',sans-serif;
}
.toast.show{transform:translate(-50%,0)}

/* ================= FOOTER ================= */
.footer{
  margin-top:2rem;
  padding-top:1.5rem;
  border-top:1px solid var(--border);
  text-align:center;
  color:var(--text-muted);
  font-size:.75rem;
  letter-spacing:.08em;
  position:relative;
  z-index:2;
}
.footer-brand{
  font-family:'Unbounded',sans-serif;
  font-weight:800;
  font-size:.95rem;
  background:linear-gradient(135deg,var(--orange-light),var(--pumpkin));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
[data-theme="light"] .footer-brand{
  background:linear-gradient(135deg,#c65513,#ff6b1a);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}

/* ================= BACK BUTTON ================= */
.back-btn{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.6rem 1.3rem;
  background:rgba(255,140,66,.1);
  border:1px solid var(--border);
  border-radius:50px;
  color:var(--text);
  font-size:.82rem;
  font-weight:700;
  font-family:'Unbounded',sans-serif;
  cursor:pointer;
  transition:var(--t-fast);
  margin-bottom:1.5rem;
  letter-spacing:.02em;
}
.back-btn:hover{
  background:var(--orange);
  color:#1a1005;
  border-color:var(--orange);
  transform:translateX(-4px);
}

.info-line{
  text-align:center;
  margin-top:1rem;
  font-size:.78rem;
  color:var(--text-muted);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.4rem;
}

/* ================= RESPONSIVE ================= */
@media (max-width:768px){
  body{padding:12px}
  .wrapper{border-radius:24px;padding:1.2rem 1rem 1.5rem}
  header{gap:1rem;margin-bottom:1.5rem}
  .brand{font-size:1rem}
  .brand-icon{width:38px;height:38px}
  .page-subtitle{font-size:clamp(1.2rem,5vw,1.5rem)}
  button{padding:.5rem .9rem;font-size:.72rem}
  .cards-grid{grid-template-columns:1fr;gap:.9rem}
  .direction-card{padding:1.4rem 1rem;gap:.6rem}
  .card-icon{width:64px;height:64px;font-size:2rem;border-radius:18px}
  .card-title{font-size:.95rem}
  .card-desc{font-size:.8rem}
  .card-badge{font-size:.65rem}
  .main-title{font-size:1.25rem;padding-bottom:.8rem;margin-bottom:1rem}
  .sub-header{font-size:.82rem;margin-bottom:1.2rem}
  .form-container{border-radius:16px;min-height:400px}
  .form-container iframe{height:520px}
  .footer{font-size:.7rem;padding-top:1rem;margin-top:1rem}
  .footer-brand{font-size:.82rem}
  .toast{padding:.7rem 1.2rem;font-size:.78rem;bottom:16px}
  .hw-web-tl,.hw-web-tr{width:120px;height:120px}
}
@media (max-width:480px){
  .wrapper{padding:1rem .75rem 1.2rem}
  .page-subtitle{font-size:1.15rem}
  .card-icon{width:56px;height:56px;font-size:1.8rem}
  .form-container iframe{height:460px}
}
</style>
</head>
<body>

<!-- ============ HALLOWEEN DECOR ============ -->
<div class="hw-vignette" aria-hidden="true"></div>

<div class="hw-web hw-web-tl" aria-hidden="true">
  <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width=".9" stroke-linecap="round">
    <path d="M0,0 L200,0"/><path d="M0,0 L176,80"/><path d="M0,0 L141,141"/>
    <path d="M0,0 L80,176"/><path d="M0,0 L0,200"/>
    <path d="M40,0 Q32,22 22,32 Q22,32 0,40"/>
    <path d="M80,0 Q65,42 42,65 Q20,78 0,80"/>
    <path d="M120,0 Q100,62 62,100 Q40,118 0,120"/>
    <path d="M160,0 Q132,82 82,132 Q58,158 0,160"/>
  </svg>
</div>
<div class="hw-web hw-web-tr" aria-hidden="true">
  <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width=".9" stroke-linecap="round">
    <path d="M0,0 L200,0"/><path d="M0,0 L176,80"/><path d="M0,0 L141,141"/>
    <path d="M0,0 L80,176"/><path d="M0,0 L0,200"/>
    <path d="M40,0 Q32,22 22,32 Q22,32 0,40"/>
    <path d="M80,0 Q65,42 42,65 Q20,78 0,80"/>
    <path d="M120,0 Q100,62 62,100 Q40,118 0,120"/>
    <path d="M160,0 Q132,82 82,132 Q58,158 0,160"/>
  </svg>
</div>

<div class="wrapper">
  <header>
    <div class="title-block">
      <a class="brand" href="#" aria-label="WMine">
        <span class="brand-icon" aria-hidden="true">
          <img src="https://i.ibb.co/nsYD0Dt4/photo-2026-09-15-18-45-55.jpg"
               alt="" class="brand-avatar" loading="eager" decoding="async">
        </span>
        <span>WMine</span>
        <span class="brand-year">2026</span>
      </a>
      <div class="page-subtitle">
        Набор в <span class="highlight">команду</span>
      </div>
    </div>
    <div class="controls">
      <button id="themeToggle" type="button" onclick="toggleTheme()">Тема</button>
    </div>
  </header>

  <div class="content" id="dynamicContent"></div>

  <footer class="footer">
    <span class="footer-brand">WMine 2026</span>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
const FORMS = {
  personnel: 'https://docs.google.com/forms/d/e/1FAIpQLSeco-nScWu4RuKcvJtGZ3h03fVXTukbGS02EwlI9lyMTKqVHA/viewform?usp=dialog',
  support: 'https://docs.google.com/forms/d/e/1FAIpQLSckS9QKpRZGPRw5u-AqG3rNDkhEU1XzvtBNSwmkC24xSmGFdw/viewform?usp=dialog',
  media: 'https://docs.google.com/forms/d/e/1FAIpQLScCelD2EEQJiAdxU1hNrhiCmKn95bgSa5GJuJcniL6uHWPE2Q/viewform?usp=dialog'
};

// Набор в модерацию ЗАКРЫТ
const RECRUITMENT_SETTINGS = {
  personnel: true,
  support: true,
  media: false
};

const labels = {
  personnel: 'Персонал проекта',
  support: 'Техническая поддержка',
  media: 'Медиа деятельность'
};

let toastTimeout;

function applyTheme(theme){
  if(theme !== 'dark' && theme !== 'light') theme = 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  document.body.classList.toggle('light-theme', theme === 'light');
  try{ localStorage.setItem('wmine-theme', theme); }catch(e){}
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = theme === 'light' ? 'Светлая' : 'Тёмная';
}

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}

function showToast(msg){
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 2500);
}

function renderHome(){
  const cards = [
    { id: 'personnel', icon: '🛡️', title: 'Модерация', desc: 'Станьте хелпером, модератором или администратором сервера.', open: RECRUITMENT_SETTINGS.personnel },
    { id: 'support', icon: '🎧', title: 'Поддержка', desc: 'Техническая поддержка игроков.', open: RECRUITMENT_SETTINGS.support },
    { id: 'media', icon: '🎬', title: 'Медиа', desc: 'Создавайте контент на YouTube, VK Видео, TikTok.', open: RECRUITMENT_SETTINGS.media }
  ];

  let html = `
    <h1 class="main-title">
      <span class="highlight">Набор в команду WMine</span>
    </h1>
    <div class="sub-header">Выберите направление для подачи заявки</div>
    <div class="cards-grid">
  `;

  cards.forEach(c => {
    const isOpen = c.open;
    const disabled = !isOpen;
    html += `
      <div class="direction-card ${disabled ? 'disabled' : ''}" data-dir="${c.id}" ${!disabled ? `onclick="openForm('${c.id}')"` : ''}>
        ${!isOpen ? '<div class="closed-overlay">Набор закрыт</div>' : ''}
        <span class="card-icon ${isOpen ? 'orange' : 'gray'}">${c.icon}</span>
        <div class="card-title">${c.title}</div>
        <div class="card-desc">${c.desc}</div>
        <span class="card-badge ${!isOpen ? 'closed' : ''}">${isOpen ? 'Открыт' : 'Закрыт'}</span>
      </div>
    `;
  });

  html += `</div>`;
  document.getElementById('dynamicContent').innerHTML = html;
}

function openForm(direction){
  const url = FORMS[direction];
  if (!RECRUITMENT_SETTINGS[direction]) {
    showToast('Набор закрыт');
    return;
  }

  let html = `
    <div style="position:relative; z-index:10;">
      <button class="back-btn" onclick="renderHome()" type="button">
        <i class="fas fa-arrow-left"></i> Назад
      </button>
    </div>
    <h1 class="main-title"><span class="highlight">${labels[direction]}</span></h1>
    <div class="sub-header">
      Заполните анкету<br>
      <a href="https://t.me/wminepe" target="_blank" rel="noopener"><i class="fas fa-paper-plane"></i> @wminepe</a>
    </div>
    <div class="form-container">
      <iframe src="${url}" allow="geolocation; microphone; camera; midi; encrypted-media" loading="lazy"></iframe>
    </div>
    <div class="info-line">
      <i class="fas fa-shield-alt"></i> Ваши данные защищены
    </div>
  `;

  document.getElementById('dynamicContent').innerHTML = html;
  showToast('Заполните анкету');
}

document.addEventListener('DOMContentLoaded', () => {
  try{
    const saved = (function(){
      try{ return localStorage.getItem('wmine-theme') || 'dark'; }catch(e){ return 'dark'; }
    })();
    applyTheme(saved);
    renderHome();
  }catch(e){
    console.error('Init error:', e);
    document.getElementById('dynamicContent').innerHTML = `
      <div style="padding:40px;text-align:center;color:var(--text-soft);">
        Ошибка загрузки. Обновите страницу.
      </div>
    `;
  }
});
</script>
</body>
</html>
